<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trénink — Trenér</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:#F4F5F2;}
:root{ --font-display:'Bebas Neue', sans-serif; --font-body:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --court:#339933; --court-dark:#286e28; --chalk:#E8622C; --chalk-dark:#a8481f; --radius:14px; --radius-sm:10px; }
.state-view{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:20px;}
.state-view.hidden{display:none;}
.state-view i{font-size:36px;color:#8A93A0;margin-bottom:16px;}
.state-view h1{font-family:var(--font-display);font-size:26px;color:#1B2430;margin:0 0 8px;letter-spacing:.02em;}
.state-view p{color:#5B6472;font-size:14px;margin:0;max-width:320px;}
.intro-start-btn{
  margin-top:26px;padding:16px 32px;border-radius:999px;border:none;background:var(--court);
  color:#fff;font-family:var(--font-display);font-size:18px;letter-spacing:.03em;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(51,153,51,.35);
}
.intro-start-btn:active{background:var(--court-dark);}
#trainingModeView{
  position:fixed;inset:0;background:#F4F5F2;display:flex;flex-direction:column;z-index:1;
  transform:translateZ(0);-webkit-transform:translateZ(0);
}
#trainingModeView.hidden{display:none;}
#trainingModeView.tm-forced-landscape{
  top:0;left:0;right:auto;bottom:auto;width:100vh;height:100vw;
  transform-origin:top left;transform:rotate(90deg) translateY(-100%);
}
.tm-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));flex-shrink:0;background:#F4F5F2;}
.tm-exit{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.06);border:none;color:#5B6472;font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
.tm-progress{font-family:var(--font-display);font-size:18px;color:#5B6472;letter-spacing:.03em;}
.tm-progress-bar{height:9px;background:rgba(27,36,48,.08);flex-shrink:0;}
.tm-progress-fill{height:100%;background:var(--court);transition:width .3s ease,background .3s ease;}
.tm-body{position:relative;flex:1;display:grid;grid-template-columns:1fr;grid-template-areas:"left" "right" "video";gap:16px;padding:24px 20px;overflow-y:auto;min-height:0;transition:background .25s ease;text-align:center;background:#F4F5F2;}
.tm-col-left{grid-area:left;display:flex;flex-direction:column;align-items:center;margin-top:30px;}
.tm-col-video{grid-area:video;}
.tm-col-right{grid-area:right;display:flex;flex-direction:column;align-items:center;}
.tm-body.tm-solo{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.tm-body.tm-solo .tm-col-video,.tm-body.tm-solo .tm-col-right{display:none;}
.tm-video-wrap{width:100%;max-width:220px;aspect-ratio:16/9;background:#000;border-radius:var(--radius-sm);overflow:hidden;margin:0 auto;}
.tm-video-wrap.hidden{display:none;}
.embed{width:100%;height:100%;border:none;display:block;}
.tm-up-next{position:absolute;top:14px;right:16px;z-index:2;display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #DCDFD9;border-left:4px solid #DCDFD9;border-radius:var(--radius-sm);padding:8px 16px;font-size:12.5px;font-weight:600;color:#5B6472;box-shadow:0 1px 2px rgba(27,36,48,.07), 0 4px 14px rgba(27,36,48,.05);transform:translateX(130%);opacity:0;transition:transform .45s ease,opacity .3s ease;}
.tm-up-next.hidden{display:none;}
.tm-up-next.shown{transform:translateX(0);opacity:1;}
.tm-up-next strong{color:#1B2430;}
.tm-part-label{font-family:var(--font-display);font-size:16px;letter-spacing:.08em;color:#8A93A0;margin-bottom:10px;display:inline-block;padding:2px 10px;border-radius:999px;}
.tm-series-label{font-size:13px;font-weight:700;color:var(--chalk-dark);background:rgba(232,98,44,.12);display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.tm-series-label.hidden{display:none;}
.tm-group-name{font-family:var(--font-display);font-size:clamp(20px,5.5vw,30px);letter-spacing:.04em;color:var(--court-dark);background:rgba(51,153,51,.1);border:2px solid var(--court);border-radius:var(--radius-sm);padding:7px 18px;margin-bottom:12px;max-width:100%;overflow-wrap:anywhere;display:inline-block;}
.tm-group-name.hidden{display:none;}
.tm-title{font-family:var(--font-display);font-size:clamp(30px,8vw,46px);line-height:1.15;color:#1B2430;margin-bottom:10px;max-width:100%;overflow-wrap:anywhere;}
.tm-desc{font-family:var(--font-display);font-size:clamp(18px,5vw,24px);letter-spacing:.03em;color:#5B6472;margin-bottom:12px;max-width:520px;overflow-wrap:anywhere;}
.tm-reps-display{font-family:var(--font-display);font-size:clamp(52px,17vw,100px);line-height:1;letter-spacing:.02em;color:var(--chalk-dark);background:rgba(232,98,44,.1);border:3px solid var(--chalk);border-radius:var(--radius);padding:10px 30px;margin:6px 0 16px;display:inline-block;}
.tm-reps-display.hidden{display:none;}
.tm-cue{font-size:clamp(15px,4vw,18px);font-weight:600;color:#5B6472;margin-bottom:8px;max-width:100%;overflow-wrap:anywhere;}
.tm-note{font-size:14px;color:#8A93A0;max-width:100%;overflow-wrap:anywhere;}
@media(min-width:860px),(orientation:landscape) and (min-width:480px){
  .tm-body{grid-template-columns:1fr 1.3fr 1fr;grid-template-areas:"left video right";align-items:center;gap:28px;padding:24px 40px;}
  .tm-col-left{margin-top:0;}
  .tm-video-wrap{max-width:100%;}
  .tm-desc,.tm-cue,.tm-note{max-width:100%;}
  .tm-up-next{position:fixed;top:calc(14px + env(safe-area-inset-top));right:70px;left:auto;transform:translateX(-100vw);transition:transform .6s ease,opacity .3s ease;}
  .tm-up-next.shown{transform:translateX(0);}
}
#trainingModeView.tm-forced-landscape .tm-body{grid-template-columns:1fr 1.3fr 1fr;grid-template-areas:"left video right";align-items:center;gap:28px;padding:24px 40px;}
#trainingModeView.tm-forced-landscape .tm-col-left{margin-top:0;}
#trainingModeView.tm-forced-landscape .tm-video-wrap{max-width:100%;}
#trainingModeView.tm-forced-landscape .tm-desc,#trainingModeView.tm-forced-landscape .tm-cue,#trainingModeView.tm-forced-landscape .tm-note{max-width:100%;}
#trainingModeView.tm-forced-landscape .tm-up-next{position:fixed;top:calc(6px + env(safe-area-inset-top));right:56px;left:auto;transform:translateX(-100vw);transition:transform .6s ease,opacity .3s ease;}
#trainingModeView.tm-forced-landscape .tm-up-next.shown{transform:translateX(0);}
.tm-timer-wrap{display:flex;align-items:center;justify-content:center;gap:22px;padding:18px 16px;flex-shrink:0;background:#F4F5F2;}
.tm-timer{font-family:var(--font-display);font-size:clamp(48px,14vw,72px);color:var(--tm-timer-fg,#1B2430);background:var(--tm-timer-bg,transparent);min-width:180px;text-align:center;font-variant-numeric:tabular-nums;border-radius:999px;padding:4px 30px;}
.tm-timer.tm-timer-done{color:var(--chalk);}
.tm-timer-btn{width:56px;height:56px;border-radius:50%;background:var(--court);color:#fff;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tm-nav{display:flex;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));flex-shrink:0;background:#F4F5F2;}
.tm-nav-btn{flex:1;padding:16px;border-radius:var(--radius);border:1px solid #DCDFD9;background:#fff;font-family:var(--font-display);font-size:16px;color:#1B2430;letter-spacing:.02em;}
.tm-nav-btn:disabled{opacity:.35;}
.tm-nav-next{background:var(--chalk);color:#fff;border-color:var(--chalk);}
.tm-info-btn{
  flex:0 0 60px;border-radius:var(--radius);border:1.5px solid var(--court);background:rgba(51,153,51,.1);
  color:var(--court-dark);display:flex;align-items:center;justify-content:center;font-size:19px;
  animation:tmInfoPulse 3.2s ease-in-out infinite;
}
.tm-info-btn.hidden{display:none;}
@keyframes tmInfoPulse{
  0%,78%,100%{box-shadow:0 0 0 0 rgba(51,153,51,0);}
  86%{box-shadow:0 0 0 7px rgba(51,153,51,.28);}
  92%{box-shadow:0 0 0 0 rgba(51,153,51,0);}
}
@media(max-width:640px){.tm-info-btn{flex-basis:52px;font-size:16px;}}
.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(20,26,34,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.hidden{display:none;}
.modal{width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(27,36,48,.25);padding:20px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
.modal-head h2{font-family:var(--font-display);font-size:22px;color:#1B2430;margin:0;line-height:1.15;}
.btn-icon{width:26px;height:26px;border-radius:50%;background:#F4F5F2;border:none;color:#5B6472;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rte-display ul,.rte-display ol{margin:2px 0 3px 18px;padding:0;}
.rte-display li{margin-bottom:1px;}
.rte-display ul{list-style-type:disc;}
.rte-display ol{list-style-type:decimal;}
.rte-display p,.rte-display div{margin:0 0 3px;}
.rte-display p:last-child,.rte-display div:last-child{margin-bottom:0;}
@media(orientation:landscape) and (max-height:500px){
  .tm-header{padding:6px 14px;padding-top:calc(6px + env(safe-area-inset-top));}
  .tm-exit{width:34px;height:34px;font-size:15px;}
  .tm-progress{font-size:14px;}
  .tm-body{padding-top:10px;padding-bottom:10px;gap:14px;}
  .tm-timer-wrap{padding:6px 16px;gap:14px;}
  .tm-timer{font-size:clamp(24px,9vh,40px);min-width:120px;padding:2px 18px;}
  .tm-timer-btn{width:38px;height:38px;font-size:15px;}
  .tm-nav{padding:6px 16px calc(6px + env(safe-area-inset-bottom));}
  .tm-nav-btn{padding:10px;font-size:14px;}
  .tm-up-next{top:calc(6px + env(safe-area-inset-top));right:56px;}
}
#trainingModeView.tm-forced-landscape .tm-header{padding:6px 14px;padding-top:calc(6px + env(safe-area-inset-top));}
#trainingModeView.tm-forced-landscape .tm-exit{width:34px;height:34px;font-size:15px;}
#trainingModeView.tm-forced-landscape .tm-progress{font-size:14px;}
#trainingModeView.tm-forced-landscape .tm-body{padding-top:10px;padding-bottom:10px;gap:14px;}
#trainingModeView.tm-forced-landscape .tm-timer-wrap{padding:6px 16px;gap:14px;}
#trainingModeView.tm-forced-landscape .tm-timer{font-size:clamp(24px,9vh,40px);min-width:120px;padding:2px 18px;}
#trainingModeView.tm-forced-landscape .tm-timer-btn{width:38px;height:38px;font-size:15px;}
#trainingModeView.tm-forced-landscape .tm-nav{padding:6px 16px calc(6px + env(safe-area-inset-bottom));}
#trainingModeView.tm-forced-landscape .tm-nav-btn{padding:10px;font-size:14px;}
</style>
</head>
<body>

<div id="stateView" class="state-view"></div>

<div id="introView" class="state-view hidden">
  <i class="fa-solid fa-clipboard-list"></i>
  <h1 id="introTitle">Trénink</h1>
  <p id="introSub"></p>
  <button type="button" id="introStartBtn" class="intro-start-btn">Spustit trénink <i class="fa-solid fa-arrow-right"></i></button>
</div>

<div id="trainingModeView" class="hidden">
  <div class="tm-header">
    <span class="tm-exit" style="visibility:hidden;"></span>
    <div class="tm-progress" id="tmProgress">1 / 1</div>
  </div>
  <div class="tm-progress-bar"><div class="tm-progress-fill" id="tmProgressFill"></div></div>
  <div class="tm-body" id="tmBody">
    <div class="tm-up-next hidden" id="tmUpNext"></div>
    <div class="tm-col-left">
      <div class="tm-part-label" id="tmPartLabel"></div>
      <div class="tm-series-label hidden" id="tmSeriesLabel"></div>
      <div class="tm-group-name hidden" id="tmGroupName"></div>
      <div class="tm-title" id="tmTitle"></div>
    </div>
    <div class="tm-col-video">
      <div class="tm-video-wrap hidden" id="tmVideoWrap"></div>
    </div>
    <div class="tm-col-right">
      <div class="tm-desc" id="tmDesc"></div>
      <div class="tm-reps-display hidden" id="tmRepsDisplay"></div>
      <div class="tm-cue" id="tmCue"></div>
      <div class="tm-note" id="tmNote"></div>
    </div>
  </div>
  <div class="tm-timer-wrap" id="tmTimerWrap">
    <button type="button" class="tm-timer-btn" id="tmTimerToggle" aria-label="Pauza/pokračovat"><i class="fa-solid fa-pause"></i></button>
    <div class="tm-timer" id="tmTimer">10:00</div>
    <button type="button" class="tm-timer-btn" id="tmTimerReset" aria-label="Restartovat čas"><i class="fa-solid fa-rotate-left"></i></button>
  </div>
  <div class="tm-nav">
    <button type="button" class="tm-nav-btn" id="tmPrevBtn"><i class="fa-solid fa-arrow-left"></i> Předchozí</button>
    <button type="button" class="tm-info-btn hidden" id="tmInfoBtn" aria-label="Info o cviku" title="Info o cviku"><i class="fa-regular fa-circle-question"></i></button>
    <button type="button" class="tm-nav-btn tm-nav-next" id="tmNextBtn">Další <i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <!-- Na telefonu na výšku jde #trainingModeView do skutečného Fullscreen API — top layer
       fullscreenu smí překrýt jen to, co je fyzicky UVNITŘ fullscreenovaného elementu, takže
       tenhle popup musí být tady, ne jako sourozenec za trainingModeView. -->
  <div id="exerciseInfoModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 id="exerciseInfoModalTitle"></h2>
        <button class="btn-icon" id="closeExerciseInfoModalBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="exerciseInfoModalShort" style="font-size:14px;font-weight:600;color:var(--court-dark);margin:-8px 0 14px;"></div>
      <div id="exerciseInfoModalLong" class="rte-display" style="font-size:13.5px;color:#5B6472;line-height:1.6;overflow-y:auto;"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { initializeFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHEDRx6jJAE1-0fvTmaMetlh4w6CeTREY",
  authDomain: "trener-6d1b2.firebaseapp.com",
  projectId: "trener-6d1b2",
  storageBucket: "trener-6d1b2.firebasestorage.app",
  messagingSenderId: "796712714371",
  appId: "1:796712714371:web:740d1c4c73f9319f509bb6"
};
const fbApp = initializeApp(firebaseConfig);
// Bez trvalé (IndexedDB) cache — tahle stránka je jednorázový needitovatelný pohled, offline
// podpora tu nemá cenu. Hlavní appka (index.html) si trvalou cache zapíná v multi-tab režimu; kdyby
// si tahle stránka řekla o svou VLASTNÍ trvalou cache (bez multi-tab), a uživatel měl zrovna
// otevřenou appku v jiné záložce, obě by si o zámek na IndexedDB "přetahovaly" — Firestore by na
// to spadl na "Failed to obtain exclusive access to the persistence layer" a stránka zůstala
// prázdná. Paměťová cache (výchozí bez localCache) tohle riziko úplně vynechává.
const db = initializeFirestore(fbApp, {});

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
}
function showState(icon, title, sub) {
  document.getElementById("trainingModeView").classList.add("hidden");
  document.getElementById("introView").classList.add("hidden");
  document.getElementById("stateView").classList.remove("hidden");
  document.getElementById("stateView").innerHTML = `
    <i class="fa-solid ${icon}"></i>
    <h1>${esc(title)}</h1>
    <p>${esc(sub)}</p>`;
}

const RTE_ALLOWED_TAGS = new Set(["P", "DIV", "BR", "UL", "OL", "LI", "B", "STRONG", "I", "EM", "U"]);
const RTE_STRIP_ENTIRELY = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED"]);
// Pozná uloženou hodnotu jako "už je to HTML z RTE" — musí pokrýt všechny povolené tagy, ne jen
// blokové (p/div/ul/ol/li/br), jinak se krátké pole s holým "<b>text</b>" (bez blokového obalu)
// vezme za starý čistý text a escapuje — místo tučného písma se pak zobrazí doslova "<b>text</b>".
const RICH_HTML_SNIFF_RE = new RegExp(`<\\/?(${[...RTE_ALLOWED_TAGS].join("|")})[ >]`, "i");
function sanitizeRichHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html || "";
  (function clean(node) {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 3) return;
      if (child.nodeType !== 1) { child.remove(); return; }
      if (RTE_STRIP_ENTIRELY.has(child.tagName)) { child.remove(); return; }
      if (!RTE_ALLOWED_TAGS.has(child.tagName)) {
        while (child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        return;
      }
      [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
      clean(child);
    });
  })(tmp);
  return tmp.innerHTML;
}
function richValueToHtml(raw) {
  if (!raw) return "";
  const looksLikeRichHtml = RICH_HTML_SNIFF_RE.test(raw);
  const asHtml = looksLikeRichHtml ? raw : String(raw).split(/\r?\n/).map(line => `<p>${esc(line)}</p>`).join("");
  return sanitizeRichHtml(asHtml);
}
function darkenHex(hex, amount) {
  const n = parseInt(hex.replace("#", ""), 16);
  const r = Math.max(0, Math.round(((n >> 16) & 255) * (1 - amount)));
  const g = Math.max(0, Math.round(((n >> 8) & 255) * (1 - amount)));
  const b = Math.max(0, Math.round((n & 255) * (1 - amount)));
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
}
function setPartTag(el, color) {
  if (!color) { el.style.background = ""; el.style.color = ""; return; }
  el.style.background = color + "33";
  el.style.color = darkenHex(color, 0.35);
}
/** Podle jasu barvy vybere čitelný text (bílá na sytější/tmavší barvě, tmavě modrošedá na
    světlé) — stejná logika jako v index.html, pro pozadí časovače podle barvy části. */
function readableTextColor(hex) {
  const m = hex.replace("#", "").match(/.{1,2}/g);
  if (!m || m.length < 3) return "#1B2430";
  const [r, g, b] = m.map(h => parseInt(h, 16));
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  return brightness < 150 ? "#fff" : "#1B2430";
}
/** Průběhový proužek nahoře se obarví podle právě probíhající části a jeho šířka odpovídá
    postupu tréninkem — tahle část se při portování z index.html ztratila, takže proužek jen
    stál na místě, ať se scrollovalo cvičeními jakkoli. */
function updateProgressBar(color) {
  const total = tmItems.length || 1;
  const pct = Math.min(100, Math.max(0, (tmIndex / total) * 100));
  const fill = document.getElementById("tmProgressFill");
  fill.style.width = pct + "%";
  fill.style.background = color || "var(--court)";
  const timerEl = document.getElementById("tmTimer");
  if (color) {
    timerEl.style.setProperty("--tm-timer-bg", color);
    timerEl.style.setProperty("--tm-timer-fg", readableTextColor(color));
  } else {
    timerEl.style.removeProperty("--tm-timer-bg");
    timerEl.style.removeProperty("--tm-timer-fg");
  }
}
function fitBoxForRatio(aspectRatioStr, maxW, maxH) {
  const parts = (aspectRatioStr || "16/9").split("/").map(Number);
  const rw = parts[0] || 16, rh = parts[1] || 9;
  let w = maxW, h = w * (rh / rw);
  if (h > maxH) { h = maxH; w = h * (rw / rh); }
  return { w: Math.round(w), h: Math.round(h) };
}
const DRIVE_FALLBACK_HEIGHT_PX = { "16/9": 480, "4/3": 480, "1/1": 560, "9/16": 640 };
function applyDriveFallbackSize(wrap, item, opts) {
  if (opts.box) {
    const fit = fitBoxForRatio(item.aspectRatio, opts.box.maxW, opts.box.maxH);
    wrap.style.aspectRatio = ""; wrap.style.maxHeight = "";
    wrap.style.width = fit.w + "px"; wrap.style.height = fit.h + "px";
    return;
  }

  wrap.style.aspectRatio = "auto"; wrap.style.maxHeight = "none";

  } else if (row.part !== "prestavka") {
    if (tmSeriesNum < (row.seriesCount || 1)) { tmSeriesNum++; tmInSeriesPause = true; renderTrainingModeItem(); return; }

  if (!locked) el.classList.add("tm-forced-landscape");
  showTrainingModeVideo(currentTrainingModeLib());
}
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && tmLandscapeForced) {
    tmLandscapeForced = false;
    document.getElementById("trainingModeView").classList.remove("tm-forced-landscape");
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    showTrainingModeVideo(currentTrainingModeLib());
  }
});

function flattenItemsFromTraining(training) {
  return (training.items || []).map(row => row);
}

async function init() {
  const params = new URLSearchParams(location.search);
  const ownerUid = params.get("u");
  const id = params.get("id");
  if (!ownerUid || !id) { showState("fa-triangle-exclamation", "Chybí odkaz na trénink", "Zkontroluj, jestli je celá adresa zkopírovaná správně."); return; }
  let snap;
  try {
    snap = await getDoc(doc(db, "users", ownerUid, "trainings", id));
  } catch (e) {
    console.error("[t.html] Nepodařilo se načíst trénink:", e);
    showState("fa-triangle-exclamation", "Nepodařilo se načíst", `Zkontroluj připojení k internetu a zkus to znovu. (${e && (e.code || e.message) || "neznámá chyba"})`);
    return;
  }
  if (!snap.exists()) { showState("fa-link-slash", "Odkaz už není platný", "Trénink byl buď smazán, nebo sdílení skončilo."); return; }
  t = snap.data();
  if (!t.share || !t.share.expiresAt || t.share.expiresAt < Date.now()) {
    showState("fa-link-slash", "Odkaz už není platný", "Platnost sdíleného odkazu vypršela.");
    return;
  }
  videos = (t.shareSnapshot && t.shareSnapshot.videos) || {};
  parts = (t.shareSnapshot && t.shareSnapshot.parts) || {};
  window.__driveApiKey = (t.shareSnapshot && t.shareSnapshot.driveApiKey) || "";
  tmItems = flattenItemsFromTraining(t);
  if (!tmItems.length) { showState("fa-inbox", "Trénink je prázdný", "Tenhle trénink zatím nemá žádné cviky."); return; }

  // Nestačí jen vyprázdnit obsah — #stateView má height:100vh (kvůli vystředění chybové hlášky),
  // takže by i prázdný zůstal zabírat celou výšku obrazovky nad úvodní obrazovkou. Přesně tohle
  // způsobovalo tu "musím scrollovat/zvětšit okno, aby se něco ukázalo" hlášku.
  document.getElementById("stateView").innerHTML = "";
  document.getElementById("stateView").classList.add("hidden");
  document.getElementById("introTitle").textContent = t.name || "Trénink";
  document.getElementById("introSub").textContent =
    `${tmItems.length} cvičení · pro nerušený trénink doporučujeme spustit na celou obrazovku.`;
  document.getElementById("introView").classList.remove("hidden");
}
/** Spustí se přímo z kliknutí na úvodní obrazovce (viz #introStartBtn níž) — fullscreen se MUSÍ
    vyžádat tady, v přímé reakci na klik, jinak by ho prohlížeč (bez uživatelského gesta) potichu
    odmítl, což byl přesně důvod, proč fullscreen dřív fakticky nikdy nenaskočil. */
async function startSharedTrainingMode() {
  document.getElementById("introView").classList.add("hidden");
  const tmView = document.getElementById("trainingModeView");
  tmView.classList.remove("hidden");
  try {
    if (tmView.requestFullscreen) await tmView.requestFullscreen();
    else if (tmView.webkitRequestFullscreen) tmView.webkitRequestFullscreen();
  } catch (e) {}
  renderTrainingModeItem();
  if (shouldForceTrainingLandscape()) enterTrainingLandscape();
}
document.getElementById("introStartBtn").addEventListener("click", startSharedTrainingMode);
init();
</script>
